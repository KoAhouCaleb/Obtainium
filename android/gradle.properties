org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disabled: Jetifier (which rewrites legacy android.support.* references to
# AndroidX) uses a bundled ASM version too old to parse some recent
# multi-release JARs - e.g. org.bouncycastle:bcprov-jdk18on (pulled in
# transitively by revanced-library) fails with "Unsupported class file major
# version 69" (see https://issuetracker.google.com/issues/184622491). Nothing
# in this project's dependency graph still uses the old support-library
# packages Jetifier exists to rewrite, so it's safe to turn off outright
# rather than pin around it.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
